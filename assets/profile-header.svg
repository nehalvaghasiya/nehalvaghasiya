<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title description">
  <title id="title">From language to working software</title>
  <desc id="description">A dark blue banner with mint and violet accents connects retrieval, agents, and applications through a small node diagram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#17243B"/>
    </linearGradient>
